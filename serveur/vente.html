<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vente — Bar-restaurant</title>
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="screen screen-with-bottom-bar">
  <div class="top-bar">
    <div>
      <h1 id="titre-session">Session —</h1>
      <div class="sub" id="sous-titre-session">…</div>
    </div>
    <select id="select-resto" onchange="changerResto(this.value)" style="width:auto; height:38px; border-radius: var(--radius); border:1px solid var(--border); font-size:14px; padding:0 8px;">
      <option value="resto_1">📍 Resto 1</option>
      <option value="resto_2">📍 CLK</option>
    </select>
  </div>

  <div class="card" style="background: var(--text-primary); color: #fff; display:flex; justify-content:space-between; align-items:center; padding: 0.9rem 1.1rem;">
    <span style="font-size:14px; opacity:0.8;">Total session</span>
    <span style="font-size:20px; font-weight:700;" id="total-session">0</span>
  </div>

  <div class="tabs" style="margin-top: 4px;">
    <button class="active" id="btn-especes" onclick="changerModePaiement('especes')">💵 Espèces</button>
    <button id="btn-wave" onclick="changerModePaiement('wave')">🟢 Wave</button>
    <button id="btn-om" onclick="changerModePaiement('orange_money')">🟠 Orange Money</button>
  </div>

  <div id="banniere-mode" style="display:none; background: var(--accent); color: #fff; text-align:center; font-size:13px; font-weight:600; padding:8px; border-radius: var(--radius); margin-top:8px;">
    Prochaine vente en mode <span id="banniere-mode-nom"></span> — pas en espèces
  </div>

  <div id="confirmation-vente" style="display:none; background: var(--success-bg); color: var(--success); text-align:center; font-size:13px; font-weight:600; padding:8px; border-radius: var(--radius); margin-top:8px;"></div>

  <input type="text" id="recherche" placeholder="🔍 Rechercher un produit…" oninput="afficherProduits()" style="margin-top: 4px;" />

  <div class="tabs">
    <button class="active" data-cat="boisson" onclick="filtrer('boisson', this)">Boissons</button>
    <button data-cat="nourriture" onclick="filtrer('nourriture', this)">Nourriture</button>
  </div>

  <div id="bloc-frequents" style="display:none; margin-top: 18px; margin-bottom: 22px;">
    <p class="section-label" style="font-size:15px; margin-bottom:10px;">⭐ Souvent vendus (cette session)</p>
    <div id="liste-frequents" style="display:flex; gap:10px; overflow-x:auto; padding-bottom:6px;"></div>
  </div>

  <div id="liste-produits"></div>
</div>

<div class="bottom-bar">
  <button onclick="ouvrirDepense()"><span class="icon">➖</span>Achat</button>
  <button onclick="window.location.href='stock-consultation.html'"><span class="icon">📦</span>Stock</button>
  <button onclick="window.location.href='piscines.html'"><span class="icon">🏊</span>Piscines</button>
  <button onclick="window.location.href='dernieres-ventes.html'"><span class="icon">📋</span>Ventes</button>
  <button class="danger" onclick="clorerSessionUI()"><span class="icon">🔒</span>Clôturer</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-client.js"></script>
<script>
let utilisateur, secteur, caisse, session, produits = [], filtreActuel = "boisson", restoActuel = "resto_1", quantites = {}, modePaiementActuel = "especes";

const NOMS_MODE = { especes: "Espèces", wave: "Wave", orange_money: "Orange Money" };

function changerModePaiement(mode) {
  modePaiementActuel = mode;
  document.getElementById("btn-especes").classList.toggle("active", mode === "especes");
  document.getElementById("btn-wave").classList.toggle("active", mode === "wave");
  document.getElementById("btn-om").classList.toggle("active", mode === "orange_money");

  const banniere = document.getElementById("banniere-mode");
  if (mode === "especes") {
    banniere.style.display = "none";
  } else {
    document.getElementById("banniere-mode-nom").textContent = NOMS_MODE[mode];
    banniere.style.display = "block";
  }
}

async function init() {
  utilisateur = getUtilisateurLocal();
  if (!utilisateur) { window.location.href = "../index.html"; return; }

  const secteurs = await getSecteurs();
  secteur = secteurs.find(s => s.type === "bar_restaurant");

  produits = await getProduits(secteur.id);
  produits.forEach(p => quantites[p.id] = 0);

  await chargerCaisseEtSession("resto_1");
  afficherProduits();
}

async function chargerCaisseEtSession(resto) {
  caisse = await getCaisseParEmplacement(secteur.id, resto);

  session = await getSessionOuverte(caisse.id);
  if (!session) {
    const heure = new Date().getHours();
    const equipe = heure < 16 ? "matin" : "soir";
    session = await ouvrirSession(caisse.id, equipe, 0, utilisateur.id);
  }

  document.getElementById("titre-session").textContent =
    "Session " + session.equipe + (resto === "resto_2" ? " — CLK" : " — Resto 1");
  document.getElementById("sous-titre-session").textContent =
    "Ouverte à " + new Date(session.ouverte_at).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });

  const total = await getTotalSession(session.id);
  document.getElementById("total-session").textContent = total.toLocaleString("fr-FR");
}

async function changerResto(resto) {
  restoActuel = resto;
  await chargerCaisseEtSession(resto);
  afficherProduits();
}

function filtrer(cat, btn) {
  filtreActuel = cat;
  document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  afficherProduits();
}

function afficherFrequents() {
  const bloc = document.getElementById("bloc-frequents");
  const conteneur = document.getElementById("liste-frequents");
  const frequents = produits
    .filter(p => quantites[p.id] > 0)
    .sort((a, b) => quantites[b.id] - quantites[a.id])
    .slice(0, 5);

  if (frequents.length === 0) { bloc.style.display = "none"; return; }
  bloc.style.display = "block";
  conteneur.innerHTML = "";
  frequents.forEach(p => {
    const chip = document.createElement("button");
    chip.style.cssText = "flex-shrink:0; background: var(--accent-bg); border-color: transparent; color: var(--accent); font-size:14px; padding: 12px 16px; white-space:nowrap; min-height:44px;";
    chip.textContent = p.nom + " (" + quantites[p.id] + ") +";
    chip.onclick = () => vendre(p.id);
    conteneur.appendChild(chip);
  });
}

function afficherProduits() {
  afficherFrequents();

  const recherche = document.getElementById("recherche").value.trim().toLowerCase();
  const conteneur = document.getElementById("liste-produits");
  conteneur.innerHTML = "";

  produits
    .filter(p => p.categorie === filtreActuel)
    .filter(p => p.emplacement === null || p.emplacement === restoActuel)
    .filter(p => !recherche || p.nom.toLowerCase().includes(recherche))
    .forEach(p => {
      const enRupture = p.categorie === "boisson" && p.stock_frigo <= 0 && !p.prix_variable;
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `
        <div>
          <p class="name">${p.nom}</p>
          <p class="meta" style="${enRupture ? 'color: var(--danger);' : ''}">
            ${enRupture ? "Rupture de stock" : p.prix_variable ? "Prix variable" : p.prix_vente.toLocaleString("fr-FR") + " FCFA"}
          </p>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
          <button class="btn-round" ${quantites[p.id] === 0 ? "disabled" : ""} onclick="retirer('${p.id}')">−</button>
          <span style="font-size:16px; font-weight:600; min-width:18px; text-align:center;">${quantites[p.id]}</span>
          <button class="btn-round primary" ${enRupture ? "disabled" : ""} onclick="vendre('${p.id}')">+</button>
        </div>`;
      conteneur.appendChild(row);
    });
}

async function vendre(produitId) {
  const produit = produits.find(p => p.id === produitId);
  let montant = produit.prix_vente;

  if (produit.prix_variable) {
    const saisie = prompt("Montant pour " + produit.nom + " (FCFA) :");
    if (saisie === null) return;
    montant = parseInt(saisie, 10);
    if (isNaN(montant) || montant <= 0) { alert("Montant invalide."); return; }
  }

  try {
    await enregistrerVente({ caisseId: caisse.id, sessionId: session.id, produit: { ...produit, prix_vente: montant }, utilisateurId: utilisateur.id, modePaiement: modePaiementActuel });
    quantites[produitId]++;
    if (produit.categorie === "boisson" && !produit.prix_variable) produit.stock_frigo--;
    const total = document.getElementById("total-session");
    total.textContent = (parseInt(total.textContent.replace(/\D/g, "")) + montant).toLocaleString("fr-FR");
    afficherProduits();

    if (modePaiementActuel !== "especes") {
      const confirmation = document.getElementById("confirmation-vente");
      confirmation.textContent = "✅ " + produit.nom + " enregistré en " + NOMS_MODE[modePaiementActuel] + " (" + montant.toLocaleString("fr-FR") + " FCFA)";
      confirmation.style.display = "block";
      setTimeout(() => { confirmation.style.display = "none"; }, 4000);
      changerModePaiement("especes");
    }
  } catch (e) {
    alert("Impossible d'enregistrer la vente. Réessaie.");
  }
}

async function retirer(produitId) {
  const produit = produits.find(p => p.id === produitId);
  try {
    const montant = await annulerVente(session.id, produitId, produit.categorie);
    if (montant === null) return;
    quantites[produitId]--;
    if (produit.categorie === "boisson") produit.stock_frigo++;
    const total = document.getElementById("total-session");
    total.textContent = Math.max(0, parseInt(total.textContent.replace(/\D/g, "")) - montant).toLocaleString("fr-FR");
    afficherProduits();
  } catch (e) {
    alert("Impossible d'annuler cette vente.");
  }
}

function ouvrirDepense() {
  localStorage.setItem("resto_actuel", restoActuel);
  window.location.href = "depense.html";
}

async function clorerSessionUI() {
  const montantReelStr = prompt("Montant compté dans la caisse (FCFA) :");
  if (montantReelStr === null) return;
  const montantReel = parseInt(montantReelStr, 10);
  if (isNaN(montantReel)) { alert("Montant invalide."); return; }

  const montantTheorique = await getTotalEspecesSession(session.id) + session.montant_ouverture;
  await cloturerSession(session.id, montantTheorique, montantReel, utilisateur.id);
  alert("Session clôturée. Écart : " + (montantReel - montantTheorique).toLocaleString("fr-FR") + " FCFA");
  window.location.href = "../index.html";
}

init();
</script>
</body>
</html>
