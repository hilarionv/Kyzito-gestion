<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stock</title>
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="screen">
  <div class="top-bar">
    <h1>Stock</h1>
    <button onclick="window.location.href='vente.html'" style="font-size:12px;">← Retour</button>
  </div>

  <input type="text" id="recherche" placeholder="🔍 Rechercher un produit…" oninput="afficher()" style="margin-bottom: 4px;" />

  <div id="liste"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/stock.js"></script>
<script>
let utilisateur, produits = [];

async function init() {
  utilisateur = getUtilisateurLocal();
  if (!utilisateur) { window.location.href = "../index.html"; return; }

  const secteurs = await getSecteurs();
  const secteur = secteurs.find(s => s.type === "bar_restaurant");
  produits = (await getProduits(secteur.id)).filter(p => p.categorie === "boisson");
  afficher();
}

function afficher() {
  const recherche = document.getElementById("recherche").value.trim().toLowerCase();
  const conteneur = document.getElementById("liste");
  conteneur.innerHTML = "";

  produits
    .filter(p => !recherche || p.nom.toLowerCase().includes(recherche))
    .forEach(p => {
      const epuise = p.stock_frigo === 0;
      const div = document.createElement("div");
      div.className = "card";
      div.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <span class="name">${p.nom}${p.emplacement ? " (" + (p.emplacement === "resto_2" ? "CLK" : "Resto 1") + ")" : ""}</span>
          <span class="badge ${epuise ? 'badge-danger' : 'badge-success'}">Frigo : ${p.stock_frigo}</span>
        </div>
        <button style="width:100%; font-size:12px;" ${p.stock_grenier === 0 ? "disabled" : ""} onclick="transfererProduit('${p.id}')">
          ↓ Remplir le frigo depuis le grenier (${p.stock_grenier} dispo)
        </button>`;
      conteneur.appendChild(div);
    });
}

async function transfererProduit(produitId) {
  const produit = produits.find(p => p.id === produitId);
  const quantiteStr = prompt(`Quantité à transférer vers le frigo (stock grenier: ${produit.stock_grenier}) :`);
  if (quantiteStr === null) return;
  const quantite = parseInt(quantiteStr, 10);
  if (isNaN(quantite) || quantite <= 0) { alert("Quantité invalide."); return; }

  try {
    await transfererVersFrigo(produitId, quantite, utilisateur.id);
    produit.stock_grenier -= quantite;
    produit.stock_frigo += quantite;
    afficher();
  } catch (e) {
    alert(e.message || "Transfert impossible.");
  }
}

init();
</script>
</body>
</html>
