<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stock</title>
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="screen">
  <div class="top-bar">
    <h1>Stock</h1>
    <button onclick="window.location.href='vente.html'" style="font-size:12px;">← Retour</button>
  </div>

  <input type="text" id="recherche" placeholder="🔍 Rechercher un produit…" oninput="afficher()" style="margin-bottom: 4px;" />

  <div id="liste"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-client.js"></script>
<script>
let produits = [];

async function init() {
  const utilisateur = getUtilisateurLocal();
  if (!utilisateur) { window.location.href = "../index.html"; return; }

  const secteurs = await getSecteurs();
  const secteur = secteurs.find(s => s.type === "bar_restaurant");
  produits = (await getProduits(secteur.id)).filter(p => p.categorie === "boisson");
  afficher();
}

function afficher() {
  const recherche = document.getElementById("recherche").value.trim().toLowerCase();
  const conteneur = document.getElementById("liste");
  conteneur.innerHTML = "";

  produits
    .filter(p => !recherche || p.nom.toLowerCase().includes(recherche))
    .forEach(p => {
      const epuise = p.stock === 0;
      const div = document.createElement("div");
      div.className = "row";
      div.innerHTML = `
        <span class="name">${p.nom}${p.emplacement ? " (" + (p.emplacement === "resto_2" ? "CLK" : "Resto 1") + ")" : ""}</span>
        <span class="badge ${epuise ? 'badge-danger' : 'badge-success'}">${p.stock}</span>`;
      conteneur.appendChild(div);
    });
}

init();
</script>
</body>
</html>
