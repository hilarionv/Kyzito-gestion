<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stock — Bar-restaurant</title>
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="screen">
  <div class="top-bar">
    <h1>Stock</h1>
    <button onclick="window.location.href='index.html'" style="font-size:12px;">← Retour</button>
  </div>

  <input type="text" id="recherche-stock" placeholder="🔍 Rechercher un produit…" oninput="filtrerRecherche()" style="margin-top: 4px;" />

  <div class="status-banner" style="background: var(--accent-bg); color: var(--accent);">
    <span>🚚 Réceptionner la livraison (fournisseur boissons)</span>
  </div>

  <div class="card">
    <div id="liste-livraison"></div>
    <button class="btn-primary" onclick="validerLivraison()">Ajouter au grenier</button>
    <p id="erreur-livraison" style="color: var(--danger); font-size: 13px; margin-top: 8px; display:none;"></p>
  </div>

  <p class="section-label" style="margin-top: 1rem;">Stock actuel</p>
  <div id="liste-stock"></div>

  <p class="section-label" style="margin-top: 1rem;">Ajouter un nouveau produit</p>
  <div class="card">
    <p class="section-label">Catégorie</p>
    <div class="grid-2" style="margin-bottom: 12px;">
      <button class="cat-btn-produit active" data-cat="boisson" onclick="choisirCategorieProduit('boisson', this)">Boisson</button>
      <button class="cat-btn-produit" data-cat="nourriture" onclick="choisirCategorieProduit('nourriture', this)">Nourriture</button>
    </div>

    <p class="section-label">Nom du produit</p>
    <input type="text" id="nouveau-nom" placeholder="Ex. Sprite" />

    <p class="section-label">Prix</p>
    <input type="number" id="nouveau-prix" placeholder="Prix en FCFA" />

    <label style="display:flex; align-items:center; gap:8px; font-size:14px; margin-bottom:10px;">
      <input type="checkbox" id="nouveau-prix-variable" style="width:auto; margin:0;" />
      Prix variable (saisi à chaque vente, ex. poisson braisé)
    </label>

    <div id="bloc-emplacement">
      <p class="section-label">Disponible à</p>
      <div class="grid-2" style="margin-bottom: 12px;">
        <button class="emp-btn active" data-emp="" onclick="choisirEmplacement('', this)">Partout</button>
        <button class="emp-btn" data-emp="resto_1" onclick="choisirEmplacement('resto_1', this)">Resto 1</button>
        <button class="emp-btn" data-emp="resto_2" onclick="choisirEmplacement('resto_2', this)">CLK</button>
      </div>
    </div>

    <button class="btn-primary" onclick="creerProduit()">Ajouter le produit</button>
    <p id="erreur-produit" style="color: var(--danger); font-size: 13px; margin-top: 8px; display:none;"></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/stock.js"></script>
<script>
let utilisateur, secteur, produits = [];

async function init() {
  utilisateur = getUtilisateurLocal();
  if (!utilisateur || utilisateur.role !== "admin") { window.location.href = "../index.html"; return; }

  const secteurs = await getSecteurs();
  secteur = secteurs.find(s => s.type === "bar_restaurant");
  produits = await getProduits(secteur.id);

  afficherFormulaireLivraison();
  afficherStock();
}

function afficherFormulaireLivraison() {
  const recherche = (document.getElementById("recherche-stock").value || "").trim().toLowerCase();
  const conteneur = document.getElementById("liste-livraison");
  conteneur.innerHTML = "";
  produits
    .filter(p => !recherche || p.nom.toLowerCase().includes(recherche))
    .forEach(p => {
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `
        <span class="name">${p.nom}</span>
        <input type="number" id="livraison-${p.id}" placeholder="Qté reçue" style="width:100px; margin:0;" />`;
      conteneur.appendChild(row);
    });
}

async function validerLivraison() {
  const erreur = document.getElementById("erreur-livraison");
  erreur.style.display = "none";
  try {
    for (const p of produits) {
      const input = document.getElementById("livraison-" + p.id);
      if (!input) continue;
      const quantite = parseInt(input.value, 10);
      if (!isNaN(quantite) && quantite > 0) {
        await enregistrerLivraison(p.id, quantite, utilisateur.id);
        p.stock_grenier += quantite;
        input.value = "";
      }
    }
    afficherStock();
  } catch (e) {
    erreur.textContent = "Impossible d'enregistrer la livraison.";
    erreur.style.display = "block";
  }
}

function afficherStock() {
  const recherche = (document.getElementById("recherche-stock").value || "").trim().toLowerCase();
  const conteneur = document.getElementById("liste-stock");
  conteneur.innerHTML = "";
  produits
    .filter(p => !recherche || p.nom.toLowerCase().includes(recherche))
    .forEach(p => {
      const epuise = p.stock_grenier === 0 && p.stock_frigo === 0;
      const div = document.createElement("div");
      div.className = "card";
      div.innerHTML = `
        <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
          <span class="name" style="${epuise ? 'color: var(--danger);' : ''}">${p.nom}</span>
          <span class="meta" style="${epuise ? 'color: var(--danger);' : ''}">
            Frigo ${p.stock_frigo} · Grenier ${p.stock_grenier}
          </span>
        </div>
        <button style="width:100%; font-size:12px;" ${p.stock_grenier === 0 ? "disabled" : ""} onclick="transfererProduit('${p.id}')">
          ↓ Transférer vers le frigo
        </button>`;
      conteneur.appendChild(div);
    });
}

function filtrerRecherche() {
  afficherFormulaireLivraison();
  afficherStock();
}

async function transfererProduit(produitId) {
  const produit = produits.find(p => p.id === produitId);
  const quantiteStr = prompt(`Quantité à transférer vers le frigo (stock grenier: ${produit.stock_grenier}) :`);
  if (quantiteStr === null) return;
  const quantite = parseInt(quantiteStr, 10);
  if (isNaN(quantite) || quantite <= 0) { alert("Quantité invalide."); return; }

  try {
    await transfererVersFrigo(produitId, quantite, utilisateur.id);
    produit.stock_grenier -= quantite;
    produit.stock_frigo += quantite;
    afficherStock();
  } catch (e) {
    alert(e.message || "Transfert impossible.");
  }
}

let categorieProduit = "boisson", emplacementProduit = "";

function choisirCategorieProduit(cat, btn) {
  categorieProduit = cat;
  document.querySelectorAll(".cat-btn-produit").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById("bloc-emplacement").style.display = cat === "boisson" ? "block" : "none";
}

function choisirEmplacement(emp, btn) {
  emplacementProduit = emp;
  document.querySelectorAll(".emp-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
}

async function creerProduit() {
  const erreur = document.getElementById("erreur-produit");
  erreur.style.display = "none";

  const nom = document.getElementById("nouveau-nom").value.trim();
  const prixVariable = document.getElementById("nouveau-prix-variable").checked;
  const prix = parseInt(document.getElementById("nouveau-prix").value, 10);

  if (!nom) { erreur.textContent = "Entre un nom de produit."; erreur.style.display = "block"; return; }
  if (!prixVariable && (isNaN(prix) || prix <= 0)) { erreur.textContent = "Entre un prix valide."; erreur.style.display = "block"; return; }

  try {
    const nouveau = await ajouterProduit({
      secteurId: secteur.id,
      nom,
      categorie: categorieProduit,
      prixVente: prixVariable ? 0 : prix,
      emplacement: categorieProduit === "boisson" ? (emplacementProduit || null) : null,
      prixVariable,
    });
    produits.push(nouveau);
    document.getElementById("nouveau-nom").value = "";
    document.getElementById("nouveau-prix").value = "";
    document.getElementById("nouveau-prix-variable").checked = false;
    afficherFormulaireLivraison();
    afficherStock();
  } catch (e) {
    erreur.textContent = "Impossible d'ajouter le produit.";
    erreur.style.display = "block";
  }
}

init();
</script>
</body>
</html>
