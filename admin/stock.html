<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stock — Bar-restaurant</title>
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="screen screen-with-bottom-bar">
  <div class="top-bar">
    <h1>Stock</h1>
    <button onclick="window.location.href='index.html'" style="font-size:12px;">← Retour</button>
  </div>

  <input type="text" id="recherche-stock" placeholder="🔍 Rechercher un produit…" oninput="filtrerRecherche()" style="margin-top: 4px;" />

  <div class="status-banner" style="background: var(--accent-bg); color: var(--accent);">
    <span>🚚 Réceptionner la livraison (fournisseur boissons)</span>
  </div>

  <div class="card">
    <div id="liste-livraison"></div>
    <button class="btn-primary" onclick="validerLivraison()">Ajouter au grenier</button>
    <p id="erreur-livraison" style="color: var(--danger); font-size: 13px; margin-top: 8px; display:none;"></p>
  </div>

  <p class="section-label" style="margin-top: 1rem;">Stock actuel</p>
  <div id="liste-stock"></div>
</div>

<div class="bottom-bar">
  <button onclick="window.location.href='index.html'"><span class="icon">🏠</span>Dashboard</button>
  <button onclick="window.location.href='historique-stock.html'"><span class="icon">🕒</span>Historique</button>
  <button onclick="window.location.href='nouveau-produit.html'"><span class="icon">➕</span>Produit</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/stock.js"></script>
<script>
let utilisateur, secteur, produits = [];

async function init() {
  utilisateur = getUtilisateurLocal();
  if (!utilisateur || utilisateur.role !== "admin") { window.location.href = "../index.html"; return; }

  const secteurs = await getSecteurs();
  secteur = secteurs.find(s => s.type === "bar_restaurant");
  // Seules les boissons ont un stock (grenier/frigo) — la nourriture
  // n'est pas gérée de cette façon.
  produits = (await getProduits(secteur.id)).filter(p => p.categorie === "boisson");

  afficherFormulaireLivraison();
  afficherStock();
}

function afficherFormulaireLivraison() {
  const recherche = (document.getElementById("recherche-stock").value || "").trim().toLowerCase();
  const conteneur = document.getElementById("liste-livraison");
  conteneur.innerHTML = "";
  produits
    .filter(p => !recherche || p.nom.toLowerCase().includes(recherche))
    .forEach(p => {
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `
        <span class="name">${p.nom}</span>
        <input type="number" id="livraison-${p.id}" placeholder="Qté reçue" style="width:100px; margin:0;" />`;
      conteneur.appendChild(row);
    });
}

async function validerLivraison() {
  const erreur = document.getElementById("erreur-livraison");
  erreur.style.display = "none";
  try {
    for (const p of produits) {
      const input = document.getElementById("livraison-" + p.id);
      if (!input) continue;
      const quantite = parseInt(input.value, 10);
      if (!isNaN(quantite) && quantite > 0) {
        await enregistrerLivraison(p.id, quantite, utilisateur.id);
        p.stock_grenier += quantite;
        input.value = "";
      }
    }
    afficherStock();
  } catch (e) {
    erreur.textContent = "Impossible d'enregistrer la livraison.";
    erreur.style.display = "block";
  }
}

function afficherStock() {
  const recherche = (document.getElementById("recherche-stock").value || "").trim().toLowerCase();
  const conteneur = document.getElementById("liste-stock");
  conteneur.innerHTML = "";
  produits
    .filter(p => !recherche || p.nom.toLowerCase().includes(recherche))
    .forEach(p => {
      const epuise = p.stock_grenier === 0 && p.stock_frigo === 0;
      const div = document.createElement("div");
      div.className = "card";
      div.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
          <span class="name" style="${epuise ? 'color: var(--danger);' : ''}">${p.nom}</span>
          <div style="display:flex; align-items:center; gap:8px;">
            <button class="btn-round" onclick="ajusterFrigo('${p.id}', -1)">−</button>
            <span class="meta" style="min-width:90px; text-align:center; ${epuise ? 'color: var(--danger);' : ''}">
              Frigo ${p.stock_frigo} · Grenier ${p.stock_grenier}
            </span>
            <button class="btn-round primary" onclick="ajusterFrigo('${p.id}', 1)">+</button>
          </div>
        </div>
        <button style="width:100%; font-size:12px;" ${p.stock_grenier === 0 ? "disabled" : ""} onclick="transfererProduit('${p.id}')">
          ↓ Transférer vers le frigo
        </button>`;
      conteneur.appendChild(div);
    });
}

function filtrerRecherche() {
  afficherFormulaireLivraison();
  afficherStock();
}

async function ajusterFrigo(produitId, delta) {
  const produit = produits.find(p => p.id === produitId);
  try {
    const nouveauStock = await corrigerStockFrigo(produitId, delta, utilisateur.id);
    produit.stock_frigo = nouveauStock;
    afficherStock();
  } catch (e) {
    alert("Impossible d'ajuster le stock.");
  }
}

async function transfererProduit(produitId) {
  const produit = produits.find(p => p.id === produitId);
  const quantiteStr = prompt(`Quantité à transférer vers le frigo (stock grenier: ${produit.stock_grenier}) :`);
  if (quantiteStr === null) return;
  const quantite = parseInt(quantiteStr, 10);
  if (isNaN(quantite) || quantite <= 0) { alert("Quantité invalide."); return; }

  try {
    await transfererVersFrigo(produitId, quantite, utilisateur.id);
    produit.stock_grenier -= quantite;
    produit.stock_frigo += quantite;
    afficherStock();
  } catch (e) {
    alert(e.message || "Transfert impossible.");
  }
}

init();
</script>
</body>
</html>
